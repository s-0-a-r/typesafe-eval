name: Code Health & Auto Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'  # Every Monday at 00:00 UTC

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  code-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch to active release branch
        run: |
          TARGET_BRANCH=$(git branch -r --list 'origin/release/v*' | sed 's#origin/##' | sort -V | tail -n 1 | tr -d ' ')
          if [ -n "$TARGET_BRANCH" ]; then
            echo "Switching to active release branch: $TARGET_BRANCH"
            git checkout "$TARGET_BRANCH"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Auto Code Health & Milestone PR Automation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          python scripts/auto_code_health.py
