[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "typesafe-eval"
version = "1.1.0"
description = "Fast, typed multi-dimensional document evaluation and CI quality gate powered by OpenAI Decisions API and TypeSafe System One."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "s-0-a-r" }
]
keywords = [
    "openai",
    "decisions-api",
    "gpt-6-luna",
    "typesafe",
    "jev",
    "evaluation",
    "system-one",
    "ai",
    "cli",
    "nlp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
    "typesafe-sdk>=0.7.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "tomli>=1.1.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.16.0",
    "mypy>=1.9.0",
    "hypothesis>=6.100.0",
    "types-PyYAML>=6.0.0",
    "tomli>=1.1.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]

[project.urls]
Homepage = "https://github.com/s-0-a-r/typesafe-eval"
Documentation = "https://s-0-a-r.github.io/typesafe-eval/"
Repository = "https://github.com/s-0-a-r/typesafe-eval"
Issues = "https://github.com/s-0-a-r/typesafe-eval/issues"
Changelog = "https://github.com/s-0-a-r/typesafe-eval/blob/main/CHANGELOG.md"

[project.scripts]
typesafe-eval = "typesafe_eval.cli:main"
jev-eval = "typesafe_eval.cli:main"
typesafe-eval-hook = "typesafe_eval.hook:pre_commit_main"

[tool.hatch.build.targets.wheel]
packages = ["src/typesafe_eval"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "tests",
    "scripts",
    "hooks",
    "CHANGELOG.md",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "acceptance: End-to-end real CLI process acceptance tests",
]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".venv",
    "dist",
    "build",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, unused vars)
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modern Python 3.10+ syntax)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (formatter / regex / tables)
    "B008",  # function call in argument defaults (Click options)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018", "B011", "E501", "B023", "B905", "C414", "B026"]
"validation/**" = ["ALL"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
cache_dir = "/tmp/mypy_cache"

[[tool.mypy.overrides]]
module = "tomli"
ignore_missing_imports = true


