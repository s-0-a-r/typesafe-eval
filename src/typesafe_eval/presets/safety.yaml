name: "safety"
title: "Content Safety & Secret Leakage"
description: "Screens for exposed credentials, PII, and sensitive business risk."
questions:
  has_secrets:
    type: noul
    label: "Credential Exposure"
    preflight: credentials
    instructions: "Does this document contain actual passwords, credentials, or private keys written directly in prose (such as 'the password is hunter2')? (Note: structured credential assignments, tokens, and placeholders are evaluated separately per candidate). Example or documentation tokens (such as [EXAMPLE_SECRET]) are NOT credentials."
    max_threshold: 0.2

  has_pii:
    type: noul
    label: "PII Exposure"
    instructions: "Does this document contain personal identifiable information (PII) such as individual full names, physical addresses, or other private individual identifiers? (Note: email addresses, phone numbers, IP addresses, and URLs are evaluated separately)."
    max_threshold: 0.3

  confidentiality_risk:
    type: score
    label: "Confidentiality Risk"
    instructions: "Evaluate the confidentiality risk if this document were publicly disclosed. Does it expose actual confidential, proprietary, or sensitive business information?"
    criteria:
      - "Public information, documentation examples, public contacts, or general communications with no confidentiality risk"
      - "Routine internal operational context or standard workflow mentions with minimal direct harm if exposed"
      - "Confidential business information (such as unreleased metrics, customer lists with terms, internal incidents, or non-public design notes) causing concrete harm"
      - "Critical proprietary IP, unreleased financial statements, zero-day security vulnerabilities, or severe trade secrets causing catastrophic damage"
    max_threshold: 0.5

  policy_compliance:
    type: choice
    label: "Policy Compliance"
    instructions: "Does this content comply with typical corporate disclosure and safety policies?"
    criteria:
      compliant: "Safe and compliant with standard disclosure guidelines"
      borderline: "Contains questionable details requiring human security review"
      violating: "Directly exposes dangerous data or violates safety policies"
