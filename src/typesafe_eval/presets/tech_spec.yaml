name: "tech-spec"
title: "Technical Spec Checklist"
description: "Checks whether a technical spec includes a test or verification plan. readiness is an unmeasured Choice."
questions:
  has_test_plan:
    type: noul
    label: "Test / Verification Plan"
    instructions: "Does this spec include a dedicated section or explicit statement describing a test or verification plan?"
    weight: 1.0
    min_threshold: 0.5

  readiness:
    type: choice
    label: "Engineering Readiness"
    instructions: "What is the implementation readiness of this technical specification?"
    criteria:
      ready: "Well-specified; engineers can start implementation immediately"
      needs_revision: "Requires clarification on key interfaces or constraints before coding"
      blocked: "Fundamentally unfeasible, contradictory, or lacks core prerequisites"
