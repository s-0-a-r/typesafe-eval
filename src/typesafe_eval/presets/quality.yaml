name: "quality"
title: "Structure and Readability Regression Detection"
description: "Evaluates structure clarity and stylistic tone for regression detection."
thresholds_as_warnings: true
questions:
  clarity:
    type: score
    label: "Clarity & Structure"
    instructions: "How clear, well-structured, and easy to follow is this document?"
    criteria:
      - "Confusing structure, hard to follow, frequent ambiguities"
      - "Generally readable, but some sections lack context or clear flow"
      - "Crisp structure, logical progression, and unambiguous phrasing"
    weight: 1.0
    min_threshold: 0.6

  tone:
    type: choice
    label: "Tone & Style"
    instructions: "What is the primary stylistic tone of this document?"
    criteria:
      professional: "Professional, objective, and well-balanced tone"
      informal: "Casual, conversational, or internal draft tone"
      inconsistent: "Inconsistent, excessively emotional, or unclear tone"
