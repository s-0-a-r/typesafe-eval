# Built by build_pairs.py. split: tuning (10 base documents). tech-spec Scores on the
# labels_quality_pairs pairs: removed_middle is down; shuffled, no_headings and padded are report only.
preset: tech-spec
runs: 3
criteria:
  group_by: kind
  degradation_ci_upper_max: -0.1
  neutral_ci_abs_max: 0.05
  min_group_size: 6
  pair_guard_neutral_abs_max: 0.1
  report_only_kinds:
  - real_correctness
  - shuffled
  - no_headings
  - padded
  per_pair_kinds:
  - paraphrase
