# Built by build_pairs.py on 2026-09-28. split: tuning (10 base documents, split by project).
# down = synthetic degradation of the base; neutral = synthetic neutral edit, hand-written paraphrase
# (Claude, runs 10) or a real correctness-only review pair (report only).
# Variants over 25000 chars are left out; see manifest_variants.json.
preset: quality
runs: 3
criteria:
  group_by: kind
  degradation_ci_upper_max: -0.1
  neutral_ci_abs_max: 0.05
  min_group_size: 6
  pair_guard_neutral_abs_max: 0.1
  report_only_kinds:
  - real_correctness
  per_pair_kinds:
  - paraphrase
